<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="splitGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="slashGradient" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="48" height="48" rx="12" fill="#0F172A" />
  <!-- Upper Left Token / Node (Divided part 1) -->
  <circle cx="16" cy="16" r="6" fill="url(#splitGradient)" />
  <!-- Lower Right Token / Node (Divided part 2) -->
  <circle cx="32" cy="32" r="6" fill="url(#splitGradient)" />
  <!-- Dynamic Division Path / Flow -->
  <path d="M34 14L14 34" stroke="url(#slashGradient)" stroke-width="4" stroke-linecap="round" />
  <!-- Center Energy Pulse -->
  <circle cx="24" cy="24" r="2.5" fill="#F8FAFC" />
</svg>